name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    env:
      BOOX_SIGNING: adhoc
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test.sh --suite mac
  browser-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./scripts/test.sh --suite browser
      - run: ./scripts/test.sh --suite android
