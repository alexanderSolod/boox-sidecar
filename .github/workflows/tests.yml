name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    env:
      BOOX_SIGNING: adhoc
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test.sh --suite mac
  browser-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./scripts/test.sh --suite browser
      - run: ./scripts/test.sh --suite android
  android-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare emulator
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-33;google_apis;x86_64'
          echo no | avdmanager create avd --name boox-tests --package 'system-images;android-33;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd boox-tests -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 120 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - run: ./scripts/test.sh --suite android --device
