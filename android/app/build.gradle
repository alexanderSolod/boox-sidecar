plugins {
    id 'com.android.application'
}

android {
    namespace 'local.boox.sidecar'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'local.boox.sidecar'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
