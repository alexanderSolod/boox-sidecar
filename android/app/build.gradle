plugins {
    id 'com.android.application'
}

android {
    namespace 'local.boox.sidecar'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'local.boox.sidecar'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        acceptance {
            initWith debug
            applicationIdSuffix '.acceptance'
            matchingFallbacks = ['debug']
        }
    }
}
